
name: Build NOVA iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "NOVA_iOS12_Swift_Project.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          set -eu
          xcodebuild -version
          echo "Repository: $GITHUB_WORKSPACE"
          echo "Files at repository root:"
          ls -la

      - name: Extract ZIP and locate project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/nova-source"
          mkdir -p "$SRC"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 -type f \
            -name 'NOVA_iOS12_Swift_Project.zip' \
            -print -quit)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -t "$ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$SRC"
          else
            echo "ZIP not found; searching checked-out files."
            cp -R "$GITHUB_WORKSPACE/." "$SRC/"
          fi

          echo "Extracted file listing:"
          find "$SRC" -maxdepth 5 -type f | head -200

          PROJECT="$(find "$SRC" -type d \
            -name 'NOVACalculator.xcodeproj' \
            -print -quit)"

          WORKSPACE="$(find "$SRC" -type d \
            -name '*.xcworkspace' \
            -print -quit)"

          if [ -n "$WORKSPACE" ]; then
            KIND="workspace"
            TARGET="$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            KIND="project"
            TARGET="$PROJECT"
          else
            echo "::error::No Xcode project or workspace found."
            exit 1
          fi

          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

          echo "Found $KIND:"
          echo "$TARGET"

      - name: Repair project configuration references
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(dirname "${{ steps.locate.outputs.path }}")"
          PBXPROJ="${{ steps.locate.outputs.path }}/project.pbxproj"

          if [ "${{ steps.locate.outputs.kind }}" != "project" ]; then
            echo "Workspace detected; skipping project.pbxproj repair."
            exit 0
          fi

          if [ ! -f "$PBXPROJ" ]; then
            echo "::error::project.pbxproj is missing."
            exit 1
          fi

          cp "$PBXPROJ" "$RUNNER_TEMP/project.pbxproj.original"

          python3 - "$PBXPROJ" <<'PY'
          import pathlib, re, sys

          p = pathlib.Path(sys.argv[1])
          text = p.read_text(encoding="utf-8-sig")

          fixes = {
              "F10000000000000000000001":
                  "F30000000000000000000001",
              "F10000000000000000000002":
                  "F30000000000000000000002",
          }

          for old, new in fixes.items():
              text = re.sub(
                  r"(buildConfigurationList\s*=\s*)" + old + r"\b",
                  lambda m: m.group(1) + new,
                  text
              )

          p.write_text(text, encoding="utf-8")
          print("Configuration-reference repair pass completed.")
          PY

          echo "Project file:"
          sed -n '1,220p' "$PBXPROJ"

          plutil -lint "$PBXPROJ"

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ steps.locate.outputs.path }}"

          if [ "${{ steps.locate.outputs.kind }}" = "workspace" ]; then
            xcodebuild -list -json -workspace "$TARGET" \
              > "$RUNNER_TEMP/xcode-list.json"
          else
            xcodebuild -list -json -project "$TARGET" \
              > "$RUNNER_TEMP/xcode-list.json"
          fi

          python3 - "$RUNNER_TEMP/xcode-list.json" \
            "${{ steps.locate.outputs.kind }}" \
            "${{ steps.locate.outputs.path }}" <<'PY'
          import json, pathlib, sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          kind = sys.argv[2]
          path = pathlib.Path(sys.argv[3])

          section = data.get(kind, {})
          schemes = section.get("schemes", [])

          if not schemes:
              raise SystemExit("No Xcode schemes found.")

          preferred = next(
              (s for s in schemes if s.lower() == "novacalculator"),
              schemes[0]
          )

          with open(pathlib.Path.cwd() / "scheme.txt", "w") as f:
              f.write(preferred)

          print("Available schemes:", schemes)
          print("Selected scheme:", preferred)
          PY

          echo "scheme=$(cat scheme.txt)" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail

          TARGET="${{ steps.locate.outputs.path }}"
          SCHEME="${{ steps.scheme.outputs.scheme }}"
          KIND="${{ steps.locate.outputs.kind }}"

          if [ "$KIND" = "workspace" ]; then
            xcodebuild \
              -workspace "$TARGET" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/NOVA-DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          else
            xcodebuild \
              -project "$TARGET" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/NOVA-DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/NOVA-DerivedData/Build/Products/Release-iphoneos/NOVACalculator.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built NOVACalculator.app not found."
            find "$RUNNER_TEMP/NOVA-DerivedData/Build/Products" \
              -maxdepth 4 -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"

          /usr/bin/zip -qry \
            "$GITHUB_WORKSPACE/NOVA-unsigned.ipa" Payload

          test -s "$GITHUB_WORKSPACE/NOVA-unsigned.ipa"
          echo "IPA created successfully."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-unsigned-IPA
          path: NOVA-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-build-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcode-list.json
            ${{ runner.temp }}/project.pbxproj.original
          if-no-files-found: ignore
          retention-days: 7
